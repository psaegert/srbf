# DSO's uDSR* on FastSRB at its sample budget, in doublings of one iteration (13,000 expressions: 500 sampled by the RNN,
# 12,500 bred by GP-meld): 1, 2, 4, 8 and 16 iterations, about 9 s to 140 s per problem on the reference machine.
# DSO v3.0.0 in the uDSR paper's Table 3 configuration (see
# srbf/worker/models/dso_worker.py and docs/models.md), run in an environment of its own:
#   scripts/envs/build_dso_env.sh {{ROOT}}/envs/dso
run:
  data_source:
    catalog: fastsrb
    sampling:
      n_support: 512
      n_validation: 512
      noise: 0.0
      problems_per_expression: 1
  model_adapter:
    type: subprocess
    worker: dso
    python: '{{ROOT}}/envs/dso/bin/python'
    config_provenance: author_blessed
    simplipy_engine: acj-5-4-llm
    timeout: 7200
    options:
      # no threads option: uDSR* runs in DSO's default configuration (reward pool n_cores_batch 1), timed with the whole
      # machine available (owner 2026-09-30: "one config, the default one")
      arm: udsr
      n_samples: !sweep
        name: ladder
        values: [13000, 26000, 52000, 104000, 208000]
  runner:
    limit: null
    save_every: 8
    resume: true
    output: !sweep
      name: ladder
      values: ['{{ROOT}}/results/evaluation/scaling/dso-udsr/fastsrb/samples_0013000.pkl', '{{ROOT}}/results/evaluation/scaling/dso-udsr/fastsrb/samples_0026000.pkl', '{{ROOT}}/results/evaluation/scaling/dso-udsr/fastsrb/samples_0052000.pkl', '{{ROOT}}/results/evaluation/scaling/dso-udsr/fastsrb/samples_0104000.pkl', '{{ROOT}}/results/evaluation/scaling/dso-udsr/fastsrb/samples_0208000.pkl']
