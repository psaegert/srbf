# Flash-ANSR reference checkpoint (psaegert/flash-ansr-v25.0-T7-3M) on FastSRB: recovery as a
# function of the sampling budget. One rung per candidate count; `--sweep-filter ladder=<choices>`
# selects a single rung. The model directory is where `flash_ansr install` puts the checkpoint.
run:
  data_source:
    catalog: fastsrb
    sampling:
      n_support: 512
      n_validation: 512
      noise: 0.0
      problems_per_expression: !sweep
        name: ladder
        values: [10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 5, 5]
  model_adapter:
    config_provenance: author_blessed
    type: flash_ansr
    model_path: '{{ROOT}}/models/psaegert/flash-ansr-v25.0-T7-3M'
    emission: fittable        # the model spells typed literals, the refiner fits every other constant
    refine_scope: fittable    # typed literals (pow exponents, rootn indices) stay as spelled
    complexity: none
    device: cuda
    evaluation_config:
      n_support: 512
      n_restarts: 8
      refiner_method: curve_fit_lm
      refiner_p0_noise: normal
      refiner_p0_noise_kwargs:
        loc: 0.0
        scale: 5
      ranking:
        mode: mdl
        mdl_strength: 1.0e-2  # decades of FVU per bit of the refined expression's description length
      prune_constant_budget: 0
      generation_config:
        method: softmax_sampling
        kwargs:
          choices: 1024
          top_k: 0
          top_p: 1
          max_len: 160        # covers the longest training expression of the checkpoint (110 tokens) plus prompt and closers
          batch_size: 128
          temperature: 1
          valid_only: true
          simplify: true
          unique: true
      device: cuda
    generation_overrides:
      kwargs:
        choices: !sweep
          name: ladder
          values: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 65536, 262144]
  runner:
    limit: null
    save_every: 64
    resume: true
    output: !sweep
      name: ladder
      values: ['{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_000001.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_000002.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_000004.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_000008.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_000016.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_000032.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_000064.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_000128.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_000256.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_000512.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_001024.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_002048.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_004096.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_008192.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_016384.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_065536.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M/fastsrb/choices_262144.pkl']
