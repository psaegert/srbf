# srbf's polynomial baseline on every srbf catalog: least-squares polynomials of total degree 0 to 10 in the
# problem's variables (a degree only while it has at most as many monomials as there are fitting points), every
# degree a candidate, the answer by 5-fold cross-validation with the one-standard-error rule (docs/models.md).
# It takes well under a second per problem, so it has one rung, its highest degree. One experiment per catalog
# (`--experiment <catalog>`), one problem per law per pass; run the config again under another SRBF_ROOT for a
# repeat. Generated by scripts/make_scaling_configs.py; do not edit by hand.
experiments:
  fastsrb:
    data_source:
      catalog: fastsrb
      sampling:
        n_support: 512
        n_validation: 512
        noise: 0.0
        problems_per_expression: 1
    model_adapter:
      config_provenance: harness_tuned
      type: polynomial
      simplipy_engine: acj-5-4-llm
      max_degree: 10
      n_folds: 5
      seed: 0
    runner:
      limit: null
      save_every: 64
      resume: true
      output: '{{ROOT}}/results/evaluation/scaling/polynomial/fastsrb/degree_10.pkl'

