# psaegert/flash-ansr-v25.0-T8-3M on every srbf catalog, run by the flash-ansr and SimpliPy it was trained with in an
# environment of its own (type: flash_ansr_worker; docs/models.md), its answers judged by srbf's
# engine: recovery as a function of the sampling budget, 1 to 65,536 draws. One experiment per
# catalog (`--experiment <catalog>`), one rung per budget (`--sweep-filter ladder=<draws>`).
# Generated by scripts/make_scaling_configs.py; do not edit by hand.
experiments:
  fastsrb:
    data_source:
      catalog: fastsrb
      sampling:
        n_support: 512
        n_validation: 512
        noise: 0.0
        problems_per_expression: 1
    model_adapter:
      config_provenance: author_blessed
      type: flash_ansr_worker
      python: '{{ROOT}}/envs/flash-ansr-0.19/bin/python'
      simplipy_engine: acj2-5-4-llm     # the judge's engine; the checkpoint keeps its own in its environment
      precision: auto
      worker_log: '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/worker_logs/fastsrb.log'
      model_path: '{{ROOT}}/models/psaegert/flash-ansr-v25.0-T8-3M'
      emission: fittable
      refine_scope: fittable
      constant_ladder: true     # re-spell fitted constants after the fit (surprise-gated fractions, pool bound); the pinned default
      complexity: none
      device: cuda
      evaluation_config:
        n_support: 512
        n_restarts: 8
        refiner_method: curve_fit_lm
        refiner_p0_noise: normal
        refiner_p0_noise_kwargs:
          loc: 0.0
          scale: 5
        ranking:
          mode: mdl
        prune_constant_budget: 0
        generation_config:
          method: softmax_sampling
          kwargs:
            draws: 1024
            top_k: 0
            top_p: 1
            max_len: 160
            batch_size: 128
            temperature: 1
            valid_only: true
            simplify: true
            unique: true
        device: cuda
      generation_overrides:
        kwargs:
          draws: !sweep
            name: ladder
            values: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 65536]
    runner:
      limit: null
      save_every: 64
      resume: true
      output: !sweep
        name: ladder
        values: ['{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/fastsrb/choices_000001.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/fastsrb/choices_000002.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/fastsrb/choices_000004.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/fastsrb/choices_000008.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/fastsrb/choices_000016.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/fastsrb/choices_000032.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/fastsrb/choices_000064.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/fastsrb/choices_000128.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/fastsrb/choices_000256.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/fastsrb/choices_000512.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/fastsrb/choices_001024.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/fastsrb/choices_002048.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/fastsrb/choices_004096.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/fastsrb/choices_008192.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/fastsrb/choices_016384.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T8-3M-worker/fastsrb/choices_065536.pkl']

