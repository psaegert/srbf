# RILS-ROLS on FastSRB along its budget of fitness evaluations (max_fit_calls), in doublings from 2^6 up to about
# 100 s per problem on the reference machine: rils-rols 1.6.7 in its first author's benchmark configuration (see
# srbf/worker/models/rilsrols_worker.py and docs/models.md), run in an environment of its own:
#   PYTHON=python3.12 scripts/envs/build_rilsrols_env.sh {{ROOT}}/envs/rilsrols
# 2^6 is the first power of two above the method's first step (scoring the perturbations of its starting model, at
# most 41 fitness evaluations on FastSRB), so every fit reaches its first least-squares local search. The top rung,
# 2^21, is PROVISIONAL: its mean fit took 148 s on a shared development machine, about 100 s on the reference
# machine at the assumed 1.5x; it is to be confirmed by a timing run on the reference machine.
run:
  data_source:
    catalog: fastsrb
    sampling:
      n_support: 512
      n_validation: 512
      noise: 0.0
      problems_per_expression: 1
  model_adapter:
    type: subprocess
    worker: rilsrols
    python: '{{ROOT}}/envs/rilsrols/bin/python'
    config_provenance: author_blessed
    simplipy_engine: acj-5-4-llm
    timeout: 4800
    options:
      max_fit_calls: !sweep
        name: ladder
        values: [64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576, 2097152]
  runner:
    limit: null
    save_every: 8
    resume: true
    output: !sweep
      name: ladder
      values: ['{{ROOT}}/results/evaluation/scaling/rilsrols/fastsrb/evals_0000064.pkl', '{{ROOT}}/results/evaluation/scaling/rilsrols/fastsrb/evals_0000128.pkl', '{{ROOT}}/results/evaluation/scaling/rilsrols/fastsrb/evals_0000256.pkl', '{{ROOT}}/results/evaluation/scaling/rilsrols/fastsrb/evals_0000512.pkl', '{{ROOT}}/results/evaluation/scaling/rilsrols/fastsrb/evals_0001024.pkl', '{{ROOT}}/results/evaluation/scaling/rilsrols/fastsrb/evals_0002048.pkl', '{{ROOT}}/results/evaluation/scaling/rilsrols/fastsrb/evals_0004096.pkl', '{{ROOT}}/results/evaluation/scaling/rilsrols/fastsrb/evals_0008192.pkl', '{{ROOT}}/results/evaluation/scaling/rilsrols/fastsrb/evals_0016384.pkl', '{{ROOT}}/results/evaluation/scaling/rilsrols/fastsrb/evals_0032768.pkl', '{{ROOT}}/results/evaluation/scaling/rilsrols/fastsrb/evals_0065536.pkl', '{{ROOT}}/results/evaluation/scaling/rilsrols/fastsrb/evals_0131072.pkl', '{{ROOT}}/results/evaluation/scaling/rilsrols/fastsrb/evals_0262144.pkl', '{{ROOT}}/results/evaluation/scaling/rilsrols/fastsrb/evals_0524288.pkl', '{{ROOT}}/results/evaluation/scaling/rilsrols/fastsrb/evals_1048576.pkl', '{{ROOT}}/results/evaluation/scaling/rilsrols/fastsrb/evals_2097152.pkl']
