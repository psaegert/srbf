# the oracle (generation_config.method: oracle) on every srbf catalog: each problem's ground truth,
# in the model's emission format, as the only candidate, fitted by the refiner exactly as a decoded
# candidate is -- recovery as a function of the refiner's restarts, 1 to 1,024. The tokenizer and
# the engine come from psaegert/flash-ansr-v25.0-T8-3M. One experiment per catalog (`--experiment <catalog>`), one rung
# per restart count (`--sweep-filter ladder=<restarts>`). Generated by
# scripts/make_scaling_configs.py; do not edit by hand.
experiments:
  fastsrb:
    data_source:
      catalog: fastsrb
      sampling:
        n_support: 512
        n_validation: 512
        noise: 0.0
        problems_per_expression: 1
    model_adapter:
      config_provenance: author_blessed
      type: flash_ansr
      model_path: '{{ROOT}}/models/psaegert/flash-ansr-v25.0-T8-3M'
      emission: fittable
      refine_scope: fittable
      constant_ladder: true     # re-spell fitted constants after the fit (surprise-gated fractions, pool bound); the pinned default
      complexity: none
      device: cpu
      evaluation_config:
        n_support: 512
        n_restarts: 8
        refiner_method: curve_fit_lm
        refiner_p0_noise: normal
        refiner_p0_noise_kwargs:
          loc: 0.0
          scale: 5
        ranking:
          mode: mdl
        prune_constant_budget: 0
        generation_config:
          method: oracle   # the adapter hands the model each problem's ground truth
        device: cpu
      evaluation_overrides:
        n_restarts: !sweep
          name: ladder
          values: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
    runner:
      limit: null
