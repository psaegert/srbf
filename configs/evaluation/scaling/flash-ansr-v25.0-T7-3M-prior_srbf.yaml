# psaegert/flash-ansr-v25.0-T7-3M's TRAINING PRIOR (prior_sampling: catalog_train.yaml beside the checkpoint, no decoder) on every srbf catalog: recovery as a function of the sampling budget, 1 to 16,384
# choices. One experiment per catalog (`--experiment <catalog>`), one rung per candidate count
# (`--sweep-filter ladder=<choices>`), ONE draw per expression per pass; run the config again under
# another FLASH_ANSR_ROOT for another draw. The model directory is where `flash_ansr install` puts
# the checkpoint. Generated by scripts/make_scaling_configs.py; do not edit by hand.
experiments:
  fastsrb:
    data_source:
      catalog: fastsrb
      sampling:
        n_support: 512
        n_validation: 512
        noise: 0.0
        problems_per_expression: 1
    model_adapter:
      config_provenance: author_blessed
      type: flash_ansr
      model_path: '{{ROOT}}/models/psaegert/flash-ansr-v25.0-T7-3M'
      emission: fittable
      refine_scope: fittable
      constant_ladder: true     # re-spell fitted constants after the fit (surprise-gated fractions, pool bound); the pinned default
      complexity: none
      device: cpu
      evaluation_config:
        n_support: 512
        n_restarts: 8
        refiner_method: curve_fit_lm
        refiner_p0_noise: normal
        refiner_p0_noise_kwargs:
          loc: 0.0
          scale: 5
        ranking:
          mode: mdl
          mdl_strength: 1.0e-2
        prune_constant_budget: 0
        generation_config:
          method: prior_sampling
          kwargs:
            choices: 1024
            unique: true
            valid_only: true
            decontaminate: true
            match_variables: true
            max_tries: 524288  # 8 x the 65,536 rung: a one-column problem that starves of unique draws stops here
        device: cpu
      generation_overrides:
        kwargs:
          choices: !sweep
            name: ladder
            values: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 65536]
    runner:
      limit: null
      save_every: 64
      resume: true
      output: !sweep
        name: ladder
        values: ['{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M-prior/fastsrb/choices_000001.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M-prior/fastsrb/choices_000002.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M-prior/fastsrb/choices_000004.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M-prior/fastsrb/choices_000008.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M-prior/fastsrb/choices_000016.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M-prior/fastsrb/choices_000032.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M-prior/fastsrb/choices_000064.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M-prior/fastsrb/choices_000128.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M-prior/fastsrb/choices_000256.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M-prior/fastsrb/choices_000512.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M-prior/fastsrb/choices_001024.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M-prior/fastsrb/choices_002048.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M-prior/fastsrb/choices_004096.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M-prior/fastsrb/choices_008192.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M-prior/fastsrb/choices_016384.pkl', '{{ROOT}}/results/evaluation/scaling/flash-ansr-v25.0-T7-3M-prior/fastsrb/choices_065536.pkl']

