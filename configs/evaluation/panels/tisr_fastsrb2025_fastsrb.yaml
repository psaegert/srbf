# TiSR under the protocol of the FastSRB paper (Martinek 2025, arXiv 2508.14481; its repository
# viktmar/FastSRB-paper-repo, src/tisr.jl), which reports that TiSR rediscovers 69.4 % of runs on the FastSRB problems.
# The paper's settings replace TiSR's defaults, so the arm is harness_tuned; it checks srbf's TiSR against that
# claim and is never a headline configuration. What it sets, as the paper's script does:
#   - 400 points, split by TiSR into halves for fitting and testing (data_split parts [0.5, 0.0, 0.5]);
#   - the operators + - * / ^ and neg exp log sqrt pow2 pow3 sin cos tanh, with the paper's forbidden nestings;
#   - the hall of fame and the selection on the node count (compl) instead of the weighted complexity, and the test
#     measures the paper checks;
#   - per problem, the largest complexity TiSR may build: 1.5 times the node count of the problem's first
#     acceptable expression (constants rounded to 5 significant digits, counted with binary operators), under
#     config_by_problem (max_compl 30, TiSR's default, holds for a problem not listed). This cap is taken from the
#     ground truth; srbf's own TiSR configs never set one;
#   - TiSR's time limit at the paper's 1,800 s.
# The paper's budget is that time limit; the paper also records the generation at which each run succeeded, so here
# the budget is a count of generations: 300, and 10 as a starved control. The paper checked its hall of fame about
# every 15 seconds, stopped a run when a member matched one of the problem's acceptable forms and counted it as a
# success. That check needs the acceptable forms inside the search, so here every run goes its full budget, and every
# member of the final hall of fame (`hall_of_fame` column) can be judged. (Stopping at the paper's precondition alone,
# a member that reproduces the test half to a relative error of 1e-8, ends runs whose member is wrong in a term that
# is negligible on the sampled ranges, which the paper's runs searched past.)
# The environment as for configs/evaluation/scaling/tisr_fastsrb.yaml.
run:
  data_source:
    catalog: fastsrb
    sampling:
      n_support: 400
      n_validation: 512
      noise: 0.0
      problems_per_expression: 1
  model_adapter:
    type: subprocess
    worker: tisr
    python: '{{ROOT}}/envs/tisr/bin/python'
    config_provenance: harness_tuned
    simplipy_engine: acj-5-4-llm
    timeout: 3000
    options:
      generations: !sweep
        name: gate
        values: [10, 300]
      time_guard: 1800.0
      config:
        binops: ['+', '-', '*', '/', '^']
        unaops: [neg, exp, log, sqrt, pow2, pow3, sin, cos, tanh]
        data_split:
          parts: '[0.5, 0.0, 0.5]'
        grammar:
          max_compl: 30
          illegal_dict: 'Dict("^" => (lef = (), rig = ("+", "-", "*", "/", "^", "neg", "exp", "log", "sqrt", "pow2", "pow3", "sin", "cos", "tanh", "VAR")), "log" => (lef = ("log", "exp"), rig = ()), "exp" => (lef = ("exp", "log"), rig = ()), "sin" => (lef = ("sin", "cos", "tanh"), rig = ()), "cos" => (lef = ("sin", "cos", "tanh"), rig = ()), "tanh" => (lef = ("sin", "cos", "tanh"), rig = ()))'
        selection:
          hall_of_fame_objectives: '[:ms_processed_e, :compl]'
          selection_objectives: '[:ms_processed_e, :one_minus_abs_spearman, :compl]'
        measures:
          additional_measures: 'Dict{Symbol, Function}(:one_minus_abs_spearman => TiSR.get_measure_one_minus_abs_spearman, :mare => TiSR.get_measure_mare, :mare_test => TiSR.get_measure_mare_test, :max_are_test => TiSR.get_measure_max_are_test)'
      config_by_problem:
        II.38.3: {grammar: {max_compl: 10}}
