# Project information
site_name: srbf
site_description: "srbf, the Symbolic Regression Benchmark Framework: one protocol, one judge and 29 catalogs for symbolic regression methods"
site_url: https://srbf.readthedocs.io/
site_author: Paul Saegert
repo_url: https://github.com/psaegert/srbf
repo_name: psaegert/srbf
edit_uri: blob/main/docs/

# Theme configuration
theme:
  name: material
  logo: assets/srbf-icon.svg
  favicon: assets/srbf-icon.svg
  palette:
    # Light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.instant
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight

# Extensions for better rendering
markdown_extensions:
  - toc:
      permalink: true
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Adding your method: adapters.md
  - Using srbf:
      - Running evaluations: running.md
      - Results: results.md
      - Paired comparisons: paired.md
  - Reference:
      - Command line: cli.md
      - Metrics: metrics.md
      - Benchmarks: benchmarks.md
      - Models: models.md
  - Fairness: fairness.md

# A broken internal link or anchor is a warning, and the docs are built with --strict.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - autorefs
