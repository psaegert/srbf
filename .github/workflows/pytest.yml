on:
  push:
    branches: main
  pull_request:

name: pytest

# srbf does not depend on flash-ansr: only the adapters built on it (flash_ansr, flash_ansr_hybrid) and the two
# refining baselines (lample_charton, brute_force) import it, from the `flash-ansr` extra. The suite therefore runs
# twice: without flash-ansr (its tests skip, and everything else must pass without it) and with it. The heavy
# optional baselines (PySR/Julia, sympy for E2E/NeSymReS) are kept OUT of CI: the eval tests mock or skip those
# adapter paths. Some eval tests need provisioned assets (models, skeleton-pool fixtures) under SRBF_ROOT and skip
# when absent.

jobs:
  pytest:
    name: pytest (${{ matrix.python-version }}, ${{ matrix.flash-ansr && 'with' || 'without' }} flash-ansr)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        flash-ansr: [true, false]

    steps:
      - uses: actions/checkout@v6.0.1

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install srbf + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[analysis${{ matrix.flash-ansr && ',flash-ansr' || '' }}]'
          pip install pytest pytest-cov
          pip install -r docs/requirements.txt   # tests/test_docs.py builds the documentation strictly

      - name: flash-ansr is absent
        if: ${{ !matrix.flash-ansr }}
        run: |
          python -c "import importlib.util, sys; sys.exit('flash-ansr was installed' if importlib.util.find_spec('flash_ansr') else 0)"

      - name: Fetch FastSRB benchmark
        run: |
          mkdir -p data/ansr-data/test_set/fastsrb
          curl -L "https://raw.githubusercontent.com/viktmar/FastSRB/main/src/expressions.yaml" \
            -o data/ansr-data/test_set/fastsrb/expressions.yaml

      - name: Run tests
        env:
          SRBF_ROOT: ${{ github.workspace }}
        run: |
          pytest tests
