# srbf: Symbolic Regression Benchmark Framework.
# The dependency on flash-ansr is one-way: flash-ansr never imports srbf.
[project]
name = "srbf"
description = "srbf: Symbolic Regression Benchmark Framework (Benchmark driver, model adapters, metrics) over symbolic-data catalogs and flash-ansr."
authors = [{ name = "Paul Saegert" }]
readme = "README.md"
requires-python = ">=3.12"
version = "0.20.3"
license = "MIT"
license-files = ["LICEN[CS]E*", "THIRD_PARTY_LICENSES*"]

dependencies = [
    "scipy>=1.9",        # paired statistics: Wilcoxon signed-rank (zero_method pinned in reporting)
    "simplipy>=0.14.6,<0.15", # direct: baselines and the mu dialect; the line the reference checkpoint is qualified against
    "symbolic-data>=0.18,<0.19", # direct: catalog / ProblemSource data layer (CatalogSource wraps it), normalize_* (token_ops), the holdout family key the decontamination probes use
    "numpy>=1.24",
    "pandas>=1.3",       # runtime: analysis tables, the refining baselines
    "scikit-learn>=1.0", # runtime: the refining baselines' BaseEstimator
    "torch>=2.0",        # direct in provenance/model_adapters/token_prediction/result_processing/baselines
    "tqdm",
    "pyyaml",            # config loading
    "zss",               # tree-edit-distance metric (eval-only)
    "editdistance",      # eval-only metric
]

[project.optional-dependencies]
# pip-installable third-party baselines whose imports are LAZY (not needed to `import srbf`).
baselines = [
    "sympy>=1.10",       # E2E + NeSymReS adapters (lazy)
    "pysr",              # PySRAdapter (lazy; also needs Julia at runtime)
    "omegaconf",         # NeSymReS adapter glue (compat/nesymres.py)
]
# srbf.analysis figures (leaderboard/scaling/per-benchmark/distribution -> the results page).
analysis = ["matplotlib>=3.5"]
# srbf does not need flash-ansr. The adapters built on it (flash_ansr) and the two baselines that fit their constants
# with its refiner (lample_charton, brute_force) do; they import it when they are built.
flash-ansr = ["flash-ansr>=0.18,<0.20"]
# the flash_ansr_hybrid adapter: flash-ansr's hybrid with its PySR stage
hybrid = ["flash-ansr[pysr]>=0.19,<0.20"]
dev = ["pre-commit", "pytest", "pytest-cov", "mypy", "flake8", "srbf[baselines]", "srbf[analysis]", "srbf[flash-ansr]"]

[project.scripts]
srbf = "srbf.__main__:main"

[project.urls]
Repository = "https://github.com/psaegert/srbf"
Issues = "https://github.com/psaegert/srbf/issues"

# NB: the NeSymReS/E2E vendored model trees + weights are NOT pip deps and never enter the wheel;
# they are provisioned by a git-clone bench-setup flow using scripts/patch_nesymres.py.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]   # src/srbf/ ; the out-of-band nesymres clone tree is not under src/, so it stays out of the wheel

[tool.setuptools.package-data]
srbf = ["py.typed"]

[tool.mypy]
# The same mypy settings as flash-ansr.
no_implicit_optional = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
explicit_package_bases = true
exclude = "(.venv|tests/|(src/)?srbf/compat/nesymres.py|(src/)?srbf/worker/)"  # worker/: standard-library code run by foreign interpreters, untyped by design   # vendored nesymres types unavailable (carried over from flash-ansr)
ignore_missing_imports = true

[tool.flake8]
ignore = ["E501", "W503"]
per-file-ignores = "__init__.py:F401"
