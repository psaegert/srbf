# srbf's runs next to each method's own published results (the original works: the authors' papers and the
# benchmark runs the authors made themselves). scripts/site_reproductions.py reads this file and the per-problem
# files in reproductions/, computes every interval and p-value, and writes the comparisons into reproductions.html.
#
# Words on the page: a "fit" is one attempt of a method on one problem; a "run" of srbf is one pass over all the
# problems (srbf ran some methods twice, on fresh points each time).
#
# test kinds (each two-sided and exact):
#   per_problem  the published results list every problem: srbf's number of solved problems against its
#                distribution if each problem is solved with its published success rate (file: one row per problem)
#   rate         only an overall rate is published: srbf's count against a binomial with that rate
#   count        the published number is one fit per problem: Fisher's exact test of the two counts
#   ranks        srbf's fits ranked among the published fits of the same dataset: the mean rank against the mean
#                of ranks drawn uniformly at random
compared:
  - method: E2E
    source:
      cite: Kamienny, d'Ascoli, Lample and Charton, End-to-end symbolic regression with transformers, NeurIPS 2022
      url: https://arxiv.org/abs/2204.10532
    rows:
      - what: Feynman laws with test R² above 0.99
        published:
          value: 86.6 %
          where: Fig. 5, noise 0, mean of 10 seeds per law (read from the figure)
          protocol: >-
            SRBench's data for 119 of the laws, split 75/25 into training and test points. E2E's model reads 200
            points at a time (a bag) and proposes candidate formulas for each bag: up to 100 bags with 10 candidates
            each, 1,000 candidates in all
        srbf:
          problems: The 120 Feynman laws (the paper's 119 and one law missing from SRBench's data)
          protocol: >-
            srbf's own runs of E2E at 256 candidates per bag. srbf's runs use 512 training points, which are 3
            bags, so 768 candidates in all, the closest of srbf's settings to the paper's 1,000. 512 fresh
            test points
          draws: [[104, 120], [103, 120]]
        test: {kind: rate, rate: 0.866}

  - method: GP-GOMEA
    source:
      cite: La Cava et al., Contemporary Symbolic Regression Methods and their Relative Performance (SRBench 2021), NeurIPS Datasets and Benchmarks 2021
      url: https://arxiv.org/abs/2107.14351
    rows:
      - what: Feynman laws with test R² above 0.999
        published:
          value: 70.9 % of 928 fits
          where: >-
            SRBench 2021's published results, noise 0. GP-GOMEA's first author, Virgolin, is a co-author of
            SRBench 2021
          protocol: >-
            116 laws, 8 fits each. Per fit, 10,000 training points and a 25,000-point test set; 1,000,000
            evaluations (formulas scored on the data)
        srbf:
          problems: The 116 laws SRBench 2021 reports
          protocol: >-
            SRBench 2021's GP-GOMEA settings, 1,000,000 evaluations; 512 training and 512 test points; one fit per law
          config: configs/evaluation/panels/gpgomea_srbench2021_feynman.yaml
          draws: [[83, 116]]
        test: {kind: per_problem, file: reproductions/gpgomea_srbench_feynman.csv}

  - method: NeSymReS
    source:
      cite: Biggio, Bendinelli, Neitz, Lucchi and Parascandolo, Neural Symbolic Regression that Scales, ICML 2021
      url: https://arxiv.org/abs/2106.06427
    rows:
      - what: Feynman laws on which over 95 % of the test points are within 5 % of the true value
        published:
          value: 48 of 52 (92.3 %)
          where: Fig. 3, the paper's main accuracy measure
          protocol: >-
            The 52 laws with up to three variables, one fit each. The paper's model, pre-trained on 10 million
            equations, with beam width 32 (the number of partial formulas the model keeps while it writes one)
        srbf:
          problems: The same 52 laws
          protocol: >-
            The released model, pre-trained on 100 million equations; srbf's own runs at beam width 32; 512
            training and 512 test points
          draws: [[36, 52], [37, 52]]
        test: {kind: count, k: 48, n: 52}
        note: >-
          The released model is not the one the paper's figures report: the paper used a model pre-trained on 10
          million equations, and the release is pre-trained on 100 million. The published row and srbf's runs
          therefore come from different models.
      - what: Feynman laws with test R² above 0.95
        published:
          value: 49 of 52 (94.2 %)
          where: Fig. 8
          protocol: The same 52 laws and model as above
        srbf:
          problems: The same 52 laws
          protocol: The released model, as above
          draws: [[43, 52], [46, 52]]
        test: {kind: count, k: 49, n: 52}

  - method: Operon
    source:
      cite: La Cava et al., Contemporary Symbolic Regression Methods and their Relative Performance (SRBench 2021), NeurIPS Datasets and Benchmarks 2021
      url: https://arxiv.org/abs/2107.14351
    rows:
      - what: Feynman laws with test R² above 0.999
        published:
          value: 85.2 % of 1,160 fits
          where: >-
            SRBench 2021's published results, noise 0. Operon's first author, Burlacu, is a co-author of SRBench
            2021
          protocol: >-
            116 laws, 10 fits each. Per fit, 10,000 training points and a 25,000-point test set; 1,000,000
            evaluations (formulas scored on the data)
        srbf:
          problems: The 116 laws SRBench 2021 reports
          protocol: >-
            SRBench 2021's Operon settings, 1,000,000 evaluations; 512 training and 512 test points; one fit per law
          config: configs/evaluation/panels/operon_srbench2021_feynman.yaml
          draws: [[98, 116]]
        test: {kind: per_problem, file: reproductions/operon_srbench_feynman.csv}

  - method: QLattice
    source:
      cite: "Imai Aldeia et al., Call for Action: Towards the Next Generation of Symbolic Regression Benchmarks (SRBench 2025), GECCO 2025 Companion"
      url: https://github.com/cavalab/srbench/tree/srbench_2025
    rows:
      - what: >-
          Test R² on six physics datasets, as a rank among the published fits: the share of the 30 published
          QLattice fits on the same dataset that score lower (ties count half). 0 is below all of them, 1 above all, 0.5 in the
          middle
        published:
          value: 30 fits per dataset (mean rank 0.50 by definition)
          where: SRBench 2025's published results (its first-principles track), with the settings QLattice's developers submitted
          protocol: SRBench's own data, split and seeds; 200 epochs
        srbf:
          problems: Six of the datasets, two seeds each (12 fits)
          protocol: srbf's QLattice code, run inside SRBench's protocol (SRBench's data, split and seeds 769 and 860); 200 epochs
          ranks: {runs: 30, of: [11, 8, 16, 1, 7, 3, 17, 18, 12, 23, 6, 27]}
        test: {kind: ranks}

  - method: RILS-ROLS
    source:
      cite: "Kartelj and Djukanović, RILS-ROLS: robust symbolic regression via iterated local search and ordinary least squares, Journal of Big Data 10, 71 (2023)"
      url: https://doi.org/10.1186/s40537-023-00743-2
    rows:
      - what: Feynman laws with test R² above 0.999
        published:
          value: 78.2 % of 1,158 fits
          where: The authors' published results (github.com/kartelj/rils-rols, paper_resources/srbench), noise 0
          protocol: >-
            116 laws, 10 fits each (two of the 1,160 are missing from the results), on SRBench's data and 75/25
            split; 1,000,000 fit calls (formulas fitted to the data)
        srbf:
          problems: The 116 laws of the paper, the ones SRBench 2021 reports
          protocol: The authors' settings, 1,000,000 fit calls; 512 training and 512 test points; one fit per law
          config: configs/evaluation/panels/rilsrols_paper_feynman.yaml
          draws: [[94, 116]]
        test: {kind: per_problem, file: reproductions/rilsrols_srbench_feynman.csv}

not_compared:
  - method: DSR
    cite: Petersen et al., Deep symbolic regression, ICLR 2021
    url: https://arxiv.org/abs/1912.04871
    reason: The paper's results use 2 million expressions per problem; srbf runs DSR at up to 16,000.
  - method: PySR
    cite: Cranmer, Interpretable Machine Learning for Science with PySR and SymbolicRegression.jl, 2023
    url: https://arxiv.org/abs/2305.01582
    reason: The paper evaluates PySR on its own benchmark of empirical laws, none of which are among srbf's problems.
  - method: uDSR*
    cite: Landajuela et al., A Unified Framework for Deep Symbolic Regression, NeurIPS 2022
    url: https://arxiv.org/abs/2205.15569
    reason: >-
      The paper's results use 2 million expressions per problem; srbf runs uDSR* at 13,000. The asterisk marks that
      srbf runs uDSR as far as it was released: without the paper's AI Feynman step (a pre-processing that splits a
      problem into simpler ones) and without pre-training.
