# The Benchmarks page: every problem set srbf runs, what kind of test it is, what srbf decided to run it, and what
# srbf could not include. scripts/site_benchmarks.py writes the page (benchmarks.html) from this file and from
# benchmarks/problem_sets.json, the list made from symbolic-data's release count (its
# tools/catalog_build/count_release.py). Texts are for a first-time reader.

